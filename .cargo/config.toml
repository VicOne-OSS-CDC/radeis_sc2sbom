[target.x86_64-unknown-linux-gnu]
linker = "gcc"

# Default to the Linux-native binary name (provided by Ubuntu/Debian `musl-tools`).
# macOS users installing via `brew install FiloSottile/musl-cross/musl-cross` get
# `x86_64-linux-musl-gcc` instead — `build-all.sh` auto-detects and overrides via
# CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER. Contributors building directly
# with `cargo build --target x86_64-unknown-linux-musl` on macOS should set that
# env var themselves or create a `musl-gcc` symlink.
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
